<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Phone Store</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f5f7;
    color: #222;
}

header {
    background: #111;
    color: white;
    padding: 22px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
}

header p {
    color: #ccc;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px #00000012;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.gallery img,
.gallery video {
    width: 100%;
    border-radius: 10px;
    object-fit: cover;
}

.price {
    color: #087b35;
    font-size: 28px;
    font-weight: bold;
}

.notice {
    background: #fff3cd;
    padding: 12px;
    border-radius: 8px;
    font-size: 13px;
}

input, textarea, select {
    width: 100%;
    padding: 13px;
    margin: 8px 0 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

button {
    background: #111;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 7px;
    cursor: pointer;
    width: 100%;
    font-size: 16px;
}

button:disabled {
    opacity: 0.6;
}

#message {
    margin-top: 15px;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 20px;
    background: #111;
    color: white;
}

@media (max-width: 500px) {
    .gallery {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>Premium Phone Store</h1>
    <p>Discover Your Next Smartphone</p>
</header>

<div class="container">

    <div class="card">
        <div class="gallery">
            <img src="IMG-20261014-WA0003.jpg" alt="Phone view 1">
            <img src="IMG-20261014-WA0006.jpg" alt="Phone view 2">
            <img src="IMG-20261014-WA0007.jpg" alt="Phone view 3">
            <img src="IMG-20261014-WA0008.jpg" alt="Phone view 4">
            <img src="IMG-20261014-WA0009.jpg" alt="Phone view 5">

            <video controls>
                <source src="VID-20261014-WA0010.mp4" type="video/mp4">
                Your browser does not support video.
            </video>
        </div>
    </div>

    <div class="card">
        <h2>iPhone 17 Pro Max Style</h2>

        <p class="price">₹18,000</p>

        <p>Explore this smartphone-style product.</p>

        <div class="notice">
            Important: This is a third-party clone-style product,
            not a genuine Apple iPhone.
        </div>
    </div>

    <div class="card">
        <h2>Place Your Order</h2>

        <form id="orderForm">

            <label>Full Name</label>
            <input
                type="text"
                id="customerName"
                maxlength="100"
                required
                placeholder="Enter your name">

            <label>Mobile Number</label>
            <input
                type="tel"
                id="customerMobile"
                pattern="[0-9]{10}"
                maxlength="10"
                required
                placeholder="10-digit mobile number">

            <label>Delivery Address</label>
            <textarea
                id="customerAddress"
                maxlength="500"
                required
                placeholder="Enter complete address"></textarea>

            <label>Quantity</label>
            <select id="quantity">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>

            <p>
                Total Amount:
                <strong id="total">₹18,000</strong>
            </p>

            <button type="submit" id="orderButton">
                Place Order
            </button>

            <p id="message" role="status"></p>

        </form>
    </div>

</div>

<footer>
    <p>© 2026 Premium Phone Store</p>
</footer>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCgGbHnsCa8JAtdjyGgFWq4SF13aiLkLEk",
    authDomain: "premium-phone-store.firebaseapp.com",
    databaseURL: "https://premium-phone-store-default-rtdb.firebaseio.com",
    projectId: "premium-phone-store",
    storageBucket: "premium-phone-store.firebasestorage.app",
    messagingSenderId: "878510750230",
    appId: "1:878510750230:web:3835bf984c280b2a1bd337",
    measurementId: "G-L617C9N2MB"
};

firebase.initializeApp(firebaseConfig);

const database = firebase.database();
const price = 18000;

const quantityInput = document.getElementById("quantity");
const totalElement = document.getElementById("total");
const orderForm = document.getElementById("orderForm");
const orderButton = document.getElementById("orderButton");
const message = document.getElementById("message");

quantityInput.addEventListener("change", function () {
    totalElement.textContent =
        "₹" + (price * Number(quantityInput.value)).toLocaleString("en-IN");
});

orderForm.addEventListener("submit", async function (event) {
    event.preventDefault();

    const name = document.getElementById("customerName").value.trim();
    const mobile = document.getElementById("customerMobile").value.trim();
    const address = document.getElementById("customerAddress").value.trim();
    const quantity = Number(quantityInput.value);

    if (!/^[0-9]{10}$/.test(mobile)) {
        message.textContent = "Please enter a valid 10-digit mobile number.";
        return;
    }

    if (!name || !address || quantity < 1 || quantity > 5) {
        message.textContent = "Please check your details.";
        return;
    }

    orderButton.disabled = true;
    orderButton.textContent = "Submitting...";
    message.textContent = "";

    try {
        const orderRef = database.ref("orders").push();

        await orderRef.set({
            name: name,
            mobile: mobile,
            address: address,
            quantity: quantity,
            product: "iPhone 17 Pro Max Style - Third-party product",
            unitPrice: price,
            total: price * quantity,
            status: "Pending",
            createdAt: Date.now()
        });

        message.style.color = "green";
        message.textContent =
            "Order submitted successfully! Order ID: " + orderRef.key;

        orderForm.reset();
        totalElement.textContent = "₹18,000";

    } catch (error) {
        console.error(error);
        message.style.color = "red";
        message.textContent =
            "Order could not be submitted. Please try again later.";
    } finally {
        orderButton.disabled = false;
        orderButton.textContent = "Place Order";
    }
});
</script>

</body>
</html>
